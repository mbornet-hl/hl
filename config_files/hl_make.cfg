#
#	hl configuration file : make
#	~~~~~~~~~~~~~~~~~~~~~~~~~~~~
#
#	@(#)	[MB] eh_hl_make.cfg	Version 1.2 du 26/10/13 - 
#

make		:
	-ei
	-2b '^make\[[0-9]+\]: Entering.*'
	-2b '^make\[[0-9]+\]: Nothing.*'
	-2g '^make\[[0-9]+\]: Leaving.*'
	-2g '^config.status: creating.*'
	-1g '^/network/lustre/.*'
	-3c '^((creating|gcc|g++|gfortran|mkdir|making|ar|ranlib) .*)'
	-2B '^((building|installing|byte-compiling).*)'
	-2Y '.+'

# Config to ease the analysis of 'make -d' output
make_debug	:
	-ei
	-n  '^[ 	]+'
	-3G '^[ 	]*(Successfully .*)'
	-1G '^[ 	]*(No need to .*)'
	-3b '^[ 	]*((Considering|Trying|Looking for|Avoiding|Finished prerequisites) .*)'
	-2c '^[ 	]*((Updating goal|Putting child|Live child|Reaping winning|Removing child) .*)'
	-2M '^[ 	]*(Rejecting impossible .*)'
	-3c '^[ 	]*(No implicit rule .*)'
	-2R '^[ 	]*(File .* does not exist.*)'
	-3y '^[ 	]*(Prerequisite .*)'
	-1G '^[ 	]*(Found an implicit rule .*)'
	-3G '^[ 	]*(Must remake .*)'
	-3b '^((GNU Make|Built for|Copyright|License|This is|There is).*)'
	-3w '^Reading .*'
	-3w '^Updating .*'
	-3W '.+'
